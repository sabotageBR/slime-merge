<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>capas</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Capas da CrazyGames (2026-10-19) feitas com o proprio jogo, como a thumb da Poki
// (tools/thumb.html): a fisica monta a cena (o bequer cheio, um par igual se abracando no alto
// da pilha e a gota da vez caindo) e o render do jogo desenha (campo e composicao em WebGL2,
// rostos, cesto e o papel do caderno, o cenario padrao). Regras (docs.crazygames.com/
// requirements/game-covers, lidas em 2026-10-19): 16:9 1920x1080, 2:3 800x1200 e 1:1 800x800,
// visual consistente; sem borda; nenhum texto alem do titulo; sem icone nem logo de loja.
//   ?w=1920&h=1080   tamanho em px (a janela do Chrome deve ter w x h); o arranjo sai da proporcao
//   ?semtitulo       sem o titulo: deitada, a pilha de perto na tela inteira (a GameDistribution
//                    reprova capa com grande area vazia); em pe, a cena de sempre sem o titulo
//   ?caixa=x0,y0,x1,y1  so essa caixa do mundo, na tela inteira e sem titulo (o icone dos portais:
//                    a pilha de perto; tools/portais.mjs)
import { criarMundo } from '../src/fisica/mundo.js';
import { criarPote } from '../src/jogo/pote.js';
import { NIVEIS, particulasNivel, nivel, diametroNivel } from '../src/jogo/niveis.js';
import { colorir } from '../src/jogo/modos/merge.js';
import { difundir } from '../src/cor/difusao.js';
import { hexDaMistura } from '../src/cor/km.js';
import { enquadrar, aplicar, paraTela, paraMundo } from '../src/render/camera.js';
import { criarCampo } from '../src/render/campo.js';
import { criarComposicao } from '../src/render/composicao.js';
import { desenharRostos, desenharAtras } from '../src/render/rostos.js';
import { desenharCestos, desenharReflexos } from '../src/render/cestos.js';
import { desenharPapel, TINTA } from '../src/render/fundo.js';
import { criarVfx } from '../src/render/vfx.js';
import { LIMIAR, RAIO_CAMPO } from '../src/render/cena.js';

const q = new URLSearchParams(location.search);
const W = Math.max(64, parseInt(q.get('w') || '1920', 10));
const H = Math.max(64, parseInt(q.get('h') || '1080', 10));
const CAIXA_PEDIDA = q.get('caixa') ? q.get('caixa').split(',').map(Number) : null;
const TITULO = !q.has('semtitulo') && !CAIXA_PEDIDA;
const HEX = NIVEIS.map((n) => hexDaMistura(n.pig));
const DT = 1 / 60;

// ------------------------------------------------------------ cena (fisica de verdade)
const m = criarMundo({ semente: 19 });
const pote = criarPote({ mundo: m, cx: 0, cesto: 'becher', eventos: [] });
const vfx = criarVfx();
function slime(k, x, y) {
  const s = m.criarSlime({ x, y, n: particulasNivel(k), material: 'gelatina', nivel: k });
  s.dados.hex = HEX[k - 1];
  s.dados.pote = 0;
  colorir(m, s, nivel(k));
  return s;
}
function rodar(seg) {
  for (let f = 0; f < Math.round(seg / DT); f++) {
    m.avancar(4);
    m.medir(DT);
    difundir(m, DT, {});
    vfx.passo(DT);
  }
}
/** Puxa as particulas de a e b uma para a outra (velocidade v), por `quadros` quadros. */
function puxar(a, b, v, quadros) {
  for (let f = 0; f < quadros; f++) {
    const dir = b.cx > a.cx ? 1 : -1;
    for (let i = 0; i < m.n; i++) {
      if (m.sl[i] === a.idx) m.vx[i] += v * dir;
      if (m.sl[i] === b.idx) m.vx[i] -= v * dir;
    }
    rodar(DT);
  }
}
// a pilha: niveis vizinhos diferentes (iguais encostados fundiriam no jogo), com o arco-iris (8)
// e o grande de bolinhas (7) para a cor saltar; soltos um a um, como numa partida
for (const [k, x] of [[10, -1.6], [8, 2.6], [3, -4.0], [9, 0.5], [1, 4.0], [6, -2.8], [4, 2.4], [7, -0.6], [2, -3.7], [3, 3.6], [6, 1.6]]) {
  slime(k, x, 12.6);
  rodar(0.75);
}
rodar(1.2);
let topo = 0;
for (const s of m.vivos()) topo = Math.max(topo, s.topo);
// o par igual (laranja) cai no alto da pilha se puxando e se espreme: o abraco da fusao
const dPar = diametroNivel(5);
const a = slime(5, -dPar * 0.52, topo + 0.15 + dPar / 2);
const b = slime(5, dPar * 0.52, topo + 0.15 + dPar / 2);
puxar(a, b, 0.32, 80);
for (let i = 0; i < m.n; i++) {
  if (m.sl[i] === a.idx) m.vx[i] = 6 * (b.cx > a.cx ? 1 : -1);
  if (m.sl[i] === b.idx) m.vx[i] = -6 * (b.cx > a.cx ? 1 : -1);
}
rodar(0.07);
// sem as estrelas do encosto: em cima do slime pareciam um "#" (a mesma conclusao da thumb da Poki)
const px = (a.cx + b.cx) / 2;
const py = (a.cy + b.cy) / 2;
a.dados.expr = 'feliz';
b.dados.expr = 'feliz';
// a gota da vez (azul, feliz) caindo por cima, com os riscos da queda
topo = 0;
for (const s of m.vivos()) topo = Math.max(topo, s.topo);
const gota = slime(2, 2.4, topo + 2.4);
gota.dados.expr = 'feliz';
for (let i = 0; i < m.n; i++) if (m.sl[i] === gota.idx) m.vy[i] = -5;
rodar(0.12);

// ------------------------------------------------------------ arranjo (pela proporcao)
/** Caixa do mundo que entra no retangulo do bequer: o cesto inteiro e a gota que cai. */
const CAIXA = [-5.7, -0.75, 5.35, Math.max(13.2, gota.topo + 1.4)];
const ar = W / H;
let rBequer, rTitulo, linhas;
/** A caixa do mundo enquadrada: a pedida, a pilha de perto (deitada sem titulo) ou o cesto inteiro. */
let caixa = CAIXA_PEDIDA || CAIXA;
if (CAIXA_PEDIDA || (!TITULO && ar > 1.3)) {
  rBequer = { x: 0, y: 0, w: W, h: H };
  rTitulo = rBequer;
  linhas = [];
  if (!CAIXA_PEDIDA) {
    // a largura do bequer inteira; a altura da proporcao, de cima da gota que cai para baixo
    const y1 = gota.topo + 0.9;
    caixa = [-5.7, y1 - 11.4 / ar, 5.7, y1];
  }
} else if (ar > 1.3) {
  // paisagem: o titulo em duas linhas a esquerda, o bequer a direita
  rBequer = { x: W * 0.5, y: H * 0.05, w: W * 0.46, h: H * 0.93 };
  rTitulo = { x: W * 0.04, y: H * 0.18, w: W * 0.46, h: H * 0.64 };
  linhas = ['Slime', 'Merge'];
} else if (ar < 0.8) {
  // retrato: o titulo em duas linhas em cima, o bequer embaixo
  rTitulo = { x: W * 0.06, y: H * 0.035, w: W * 0.88, h: H * 0.27 };
  rBequer = { x: W * 0.02, y: H * 0.31, w: W * 0.96, h: H * 0.67 };
  linhas = ['Slime', 'Merge'];
} else {
  // quadrada: o titulo numa linha em cima, o bequer embaixo
  rTitulo = { x: W * 0.05, y: H * 0.04, w: W * 0.9, h: H * 0.2 };
  rBequer = { x: W * 0.06, y: H * 0.255, w: W * 0.88, h: H * 0.73 };
  linhas = ['Slime Merge'];
}
const cam = enquadrar(caixa, rBequer);

// ------------------------------------------------------------ fundo: o caderno
/** O papel quadriculado do jogo, com uma luz suave atras do bequer e os cantos mais fundos. */
function fundo(ctx) {
  desenharPapel(ctx, cam, 1, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const [fx, fy] = paraTela(cam, 0, 6.5);
  const R = Math.max(W, H);
  const luz = ctx.createRadialGradient(fx, fy, 0, fx, fy, R * 0.55);
  luz.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
  luz.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = luz;
  ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, R * 0.38, W / 2, H / 2, R * 0.85);
  v.addColorStop(0, 'rgba(70, 80, 110, 0)');
  v.addColorStop(1, 'rgba(70, 80, 110, 0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  // a sombra do bequer no papel
  const [sx, sy] = paraTela(cam, -0.2, -0.55);
  const sombra = ctx.createRadialGradient(sx, sy, 0, sx, sy, cam.s * 6.5);
  sombra.addColorStop(0, 'rgba(23, 22, 28, 0.2)');
  sombra.addColorStop(1, 'rgba(23, 22, 28, 0)');
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(1, 0.16);
  ctx.translate(-sx, -sy);
  ctx.fillStyle = sombra;
  ctx.fillRect(sx - cam.s * 7, sy - cam.s * 7, cam.s * 14, cam.s * 14);
  ctx.restore();
}

// ------------------------------------------------------------ titulo (gel, como os botoes)
const CORES = [['#a6ef5a', '#4fbf2c', '#2f8f1b'], ['#c9a8ff', '#8a5cf0', '#5b33c4']];
/**
 * Uma palavra em Fredoka 700: tinta grossa por fora, gel em degrade por dentro, o brilho de
 * cima (a bolha de gel dos botoes de reforco) e a sombra de tinta embaixo.
 */
function palavra(ctx, texto, x, y, tam, cores) {
  ctx.save();
  ctx.font = `700 ${tam}px Fredoka`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  const sobe = tam * 0.72;
  // sombra de tinta (o "0 0.18em 0" dos botoes)
  ctx.fillStyle = TINTA;
  ctx.strokeStyle = TINTA;
  ctx.lineWidth = tam * 0.17;
  ctx.strokeText(texto, x, y + tam * 0.075);
  ctx.fillText(texto, x, y + tam * 0.075);
  // contorno
  ctx.lineWidth = tam * 0.17;
  ctx.strokeText(texto, x, y);
  // gel
  const g = ctx.createLinearGradient(0, y - sobe, 0, y);
  g.addColorStop(0, cores[0]);
  g.addColorStop(0.55, cores[1]);
  g.addColorStop(1, cores[2]);
  ctx.fillStyle = g;
  ctx.fillText(texto, x, y);
  // brilho: uma faixa clara no alto das letras, recortada pelo proprio texto
  const cv = document.createElement('canvas');
  const larg = Math.ceil(ctx.measureText(texto).width + tam);
  cv.width = larg;
  cv.height = Math.ceil(tam * 1.4);
  const c2 = /** @type {CanvasRenderingContext2D} */ (cv.getContext('2d'));
  c2.font = ctx.font;
  c2.textAlign = 'center';
  c2.textBaseline = 'alphabetic';
  const bx = larg / 2;
  const by = tam * 1.05;
  c2.fillStyle = '#fff';
  c2.fillText(texto, bx, by);
  c2.globalCompositeOperation = 'source-in';
  const gb = c2.createLinearGradient(0, by - sobe, 0, by - sobe * 0.45);
  gb.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
  gb.addColorStop(0.7, 'rgba(255, 255, 255, 0.25)');
  gb.addColorStop(1, 'rgba(255, 255, 255, 0)');
  c2.fillStyle = gb;
  c2.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(cv, x - bx, y - by);
  ctx.restore();
}

function titulo(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // o maior tamanho que cabe no retangulo (largura da linha mais longa e altura das linhas)
  ctx.font = '700 100px Fredoka';
  const larg = Math.max(...linhas.map((l) => ctx.measureText(l).width)) / 100;
  const passo = 0.86; // entre linhas, em tamanhos
  const alt = 0.74 + (linhas.length - 1) * passo + 0.12;
  const tam = Math.min(rTitulo.w / (larg * 1.12), rTitulo.h / alt);
  const cx = rTitulo.x + rTitulo.w / 2;
  let y = rTitulo.y + (rTitulo.h - alt * tam) / 2 + 0.74 * tam;
  ctx.save();
  ctx.translate(cx, rTitulo.y + rTitulo.h / 2);
  ctx.rotate(-0.045);
  ctx.translate(-cx, -(rTitulo.y + rTitulo.h / 2));
  if (linhas.length === 1) {
    // uma linha: "Slime" verde e "Merge" lilas lado a lado
    ctx.font = `700 ${tam}px Fredoka`;
    const espaco = ctx.measureText(' ').width;
    const l1 = ctx.measureText('Slime').width;
    const l2 = ctx.measureText('Merge').width;
    const x0 = cx - (l1 + espaco + l2) / 2;
    palavra(ctx, 'Slime', x0 + l1 / 2, y, tam, CORES[0]);
    palavra(ctx, 'Merge', x0 + l1 + espaco + l2 / 2, y, tam, CORES[1]);
  } else {
    linhas.forEach((l, i) => palavra(ctx, l, cx + (i ? tam * 0.12 : -tam * 0.12), y + i * passo * tam, tam, CORES[i]));
  }
  ctx.restore();
}

// ------------------------------------------------------------ desenho (o render do jogo)
async function desenhar() {
  const fonte = new FontFace('Fredoka', 'url(../src/ui/fontes/fredoka-latin-700-normal.woff2)', { weight: '700' });
  document.fonts.add(await fonte.load());
  const cv = /** @type {HTMLCanvasElement} */ (document.getElementById('c'));
  cv.width = W;
  cv.height = H;
  const ctx = /** @type {CanvasRenderingContext2D} */ (cv.getContext('2d'));
  const t = 0.55;
  const potes = [{ idx: pote.idxParedes, cesto: pote.cesto }];
  fundo(ctx);
  desenharCestos(ctx, cam, 1, m.paredes, { potes, t, estiloSoltas: 'vidro', numeros: false });
  desenharAtras(ctx, m, cam, 1, 'classico');
  // riscos de tinta acima da gota que cai (pose dinamica)
  aplicar(ctx, cam, 1);
  ctx.strokeStyle = 'rgba(23, 22, 28, 0.55)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 0.13;
  for (const [dx, a0, b0] of [[-0.8, 0.45, 1.5], [0, 0.7, 2.1], [0.8, 0.45, 1.4]]) {
    ctx.beginPath();
    ctx.moveTo(gota.cx + dx * gota.raio0, gota.topo + a0);
    ctx.lineTo(gota.cx + dx * gota.raio0, gota.topo + b0);
    ctx.stroke();
  }
  const glcv = document.createElement('canvas');
  const comp = criarComposicao(glcv);
  glcv.width = W;
  glcv.height = H;
  const [x0, y1] = paraMundo(cam, 0, 0);
  const [x1, y0] = paraMundo(cam, W, H);
  // a celula do campo acompanha o zoom (o contorno nao serrilha)
  const celula = Math.min(0.05, 2.2 / cam.s);
  const campo = criarCampo({ janela: [x0 - 1.5, y0 - 1.5, x1 + 1.5, y1 + 1.5], celula, raio: RAIO_CAMPO });
  campo.acumular(m);
  comp.desenhar(campo, cam, 1, { tempo: t, brilho: 1, limiar: LIMIAR, traco: cam.s * 0.05 });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(glcv, 0, 0);
  desenharRostos(ctx, m, cam, 1, t, { olhar: [px, py + 1.5], estilo: 'classico' });
  desenharReflexos(ctx, cam, 1, m.paredes, potes);
  vfx.desenhar(ctx, cam, 1);
  if (TITULO) titulo(ctx);
  document.title = 'PRONTO';
}
desenhar();
</script></body></html>
